<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告白 — ひらくまで、とどかない</title>
</head>
<body>

  <!-- この詩は、CSSもJavaScriptも使っていません。素のHTMLだけです。 -->

  <h1>告白</h1>

  <p>きょうは、なんでもない一日でした。</p>

  <details>
    <summary>……と、書いておきます。</summary>

    <p>本当は、一日じゅう、あなたのことを考えていました。</p>

    <details>
      <summary>それと、もうひとつ。</summary>

      <p>言おうか、ずっと迷っていたのですが。</p>

      <details>
        <summary>やっぱり、ここまで開いてくれたのなら。</summary>

        <p>……いえ。</p>
        <p>やっぱり、なんでもありません。</p>
        <!-- ほんとうは、すきでした。 -->

      </details>
    </details>
  </details>

  <p>また、あした。</p>

  <hr>
  <p><small>素のHTMLのみ（&lt;details&gt; &lt;summary&gt; &lt;!-- --&gt;）。「ソースを表示」で、最後の一行を探してみてください。</small></p>

</body>
</html>
