<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSSもJavaScriptも使っていません。素のHTMLだけ。
       下の meta が、10秒ごとにこのページ自身を読み込み直します。
       朝は、何度でも、最初からやり直されます。 -->
  <meta http-equiv="refresh" content="10">

  <title>終わらない朝</title>
</head>
<body>

  <h1>終わらない朝</h1>

  <p>目が覚める。</p>
  <p>カーテンの隙間が、白い。</p>
  <p>きょうこそ、と思う。</p>
  <p>きょうこそ、あの人に、電話をしよう。</p>

  <p>……</p>

  <p>そう思っているうちに、</p>
  <p>また、目が覚める。</p>

  <hr>
  <p><small>素のHTMLのみ（&lt;meta http-equiv="refresh"&gt;）。
  このページは10秒ごとに自分自身へ戻り、同じ朝をくり返します。
  閉じるまで、終わりません。</small></p>

</body>
</html>
