<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二重の声</title>
</head>
<body>

  <!-- CSSもJavaScriptも使っていません。素のHTMLだけ。
       ruby で、漢字の上に「本来とは違う読み」を振っています。
       表記と読みが、二つの声になって重なります。 -->

  <h1>二重の声</h1>

  <p>
    <ruby>永遠<rp>(</rp><rt>いっしゅん</rt><rp>)</rp></ruby>を、
    きみと過ごした。
  </p>

  <p>
    あれは<ruby>本気<rp>(</rp><rt>じょうだん</rt><rp>)</rp></ruby>だったの、
    それとも<ruby>冗談<rp>(</rp><rt>ほんき</rt><rp>)</rp></ruby>だったの。
  </p>

  <p>
    <ruby>大丈夫<rp>(</rp><rt>たすけて</rt><rp>)</rp></ruby>、
    と<ruby>笑<rp>(</rp><rt>な</rt><rp>)</rp></ruby>った。
  </p>

  <p>
    <ruby>さようなら<rp>(</rp><rt>いかないで</rt><rp>)</rp></ruby>。
  </p>

  <hr>
  <p><small>素のHTMLのみ（&lt;ruby&gt; &lt;rt&gt; &lt;rp&gt;）。漢字の上の小さな文字が、もう一つの本音です。</small></p>

</body>
</html>
