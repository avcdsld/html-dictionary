<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見えない絵</title>
</head>
<body>

  <!-- CSSもJavaScriptも使っていません。素のHTMLだけ。
       画像の src は、わざと空にしてあります。
       だから絵は表示されず、alt に書いた言葉だけが残ります。 -->

  <h1>見えない絵</h1>

  <p>ここに、一枚の絵を飾りました。<br>
  けれど、その絵は、もう誰にも見えません。</p>

  <p><img src="" alt="夏の終わりの、午後四時。あなたは縁側で、こちらに背を向けて座っている。麦茶の氷が、ひとつ、溶ける音がした。"></p>

  <p><img src="" alt="駅のホーム。発車のベル。あなたは何か言いかけて、結局、手だけを振った。"></p>

  <p><img src="" alt="（この絵には、もう、何も写っていません）"></p>

  <hr>
  <p><small>素のHTMLのみ（&lt;img alt&gt;）。表示されない絵を、言葉だけが見せています。</small></p>

</body>
</html>
